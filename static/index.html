<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --user-msg: #3b82f6;
            --bot-msg: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #60a5fa;
            --bot-border: #475569;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background-color: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-header {
            padding: 20px 24px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-title h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .chat-title p {
            margin: 4px 0 0 0;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .messages {
            flex-grow: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            align-self: flex-start;
            background-color: var(--bot-msg);
            border: 1px solid var(--bot-border);
            border-bottom-left-radius: 4px;
        }
        
        /* Markdown formatting for bot messages */
        .bot-message pre {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
        }
        .bot-message code {
            font-family: monospace;
            background: rgba(0,0,0,0.3);
            padding: 2px 4px;
            border-radius: 4px;
        }

        .tool-message {
            align-self: flex-start;
            background-color: rgba(96, 165, 250, 0.1);
            color: var(--accent);
            border-left: 3px solid var(--accent);
            font-size: 0.85rem;
            font-family: monospace;
            padding: 8px 12px;
            border-radius: 0 8px 8px 0;
            margin-bottom: -8px; /* Pull it closer to the response */
        }

        .input-area {
            padding: 20px 24px;
            background-color: var(--chat-bg);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 14px 20px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: #0f172a;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--user-msg);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        button {
            background-color: var(--user-msg);
            color: white;
            border: none;
            border-radius: 100px;
            padding: 0 24px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background-color: #2563eb;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading Dots */
        .typing-indicator {
            align-self: flex-start;
            background-color: var(--bot-msg);
            padding: 12px 16px;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            display: none;
            gap: 6px;
            align-items: center;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        /* Session ID badge */
        .status-badge {
            background-color: rgba(16, 185, 129, 0.2);
            color: #34d399;
            padding: 4px 10px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #34d399;
            border-radius: 50%;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-title">
                <h1>Customer Support AI</h1>
                <p>Powered by MCP & Local SQLite</p>
            </div>
            <div class="status-badge">
                <span class="status-dot"></span>
                Connected
            </div>
        </div>

        <div class="messages" id="chat-box">
            <div class="message bot-message">
                Hello! I'm your AI assistant with direct access to your local Customer Support database. How can I help you today? Try asking about a customer's orders using their email!
            </div>
        </div>
        
        <div class="typing-indicator" id="loading">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <form class="input-area" id="chat-form">
            <input type="text" id="user-input" placeholder="e.g., Can you look up recent orders for alice@example.com?" autocomplete="off" required>
            <button type="submit" id="send-btn">Send</button>
        </form>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const loadingIndicator = document.getElementById('loading');
        const sendBtn = document.getElementById('send-btn');
        
        // Generate a random session ID for this browser tab
        const sessionId = Math.random().toString(36).substring(2, 15);

        // Simple markdown parser for bold, line breaks, and lists
        function formatMessage(text) {
            let html = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br/>');
            return html;
        }

        function addMessage(text, sender, isTool = false) {
            const tempDiv = document.createElement('div');
            
            if (isTool) {
               tempDiv.className = `message tool-message`;
               tempDiv.textContent = `⚡ Executed Tool: ${text}`;
            } else {
               tempDiv.className = `message ${sender}-message`;
               if (sender === 'bot') {
                   tempDiv.innerHTML = formatMessage(text);
               } else {
                   tempDiv.textContent = text;
               }
            }
            
            chatBox.appendChild(tempDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage(e) {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            userInput.value = '';
            
            // Disable input while communicating
            userInput.disabled = true;
            sendBtn.disabled = true;
            
            // Show loading and explicitly append it to the bottom
            chatBox.appendChild(loadingIndicator);
            loadingIndicator.style.display = 'flex';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        message: message,
                        session_id: sessionId
                    })
                });

                const data = await response.json();
                
                // Hide loading
                loadingIndicator.style.display = 'none';

                if (response.ok) {
                    // Show tools if any were used
                    if (data.tools_used && data.tools_used.length > 0) {
                        data.tools_used.forEach(tool => addMessage(tool, 'bot', true));
                    }
                    // Show main answer
                    addMessage(data.response, 'bot');
                } else {
                    addMessage(`Error: ${data.detail}`, 'bot');
                }
            } catch (error) {
                loadingIndicator.style.display = 'none';
                addMessage(`Connection error: Could not reach the server.`, 'bot');
            } finally {
                // Re-enable input
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        chatForm.addEventListener('submit', sendMessage);
    </script>
</body>
</html>
